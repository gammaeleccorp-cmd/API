name: CI (mohammadi/Django)

on:
  push:
    branches: [main]
    paths:
      - "mohammadi/Django/**"
      - ".github/workflows/ci-mohammadi.yml"
  pull_request:
    paths:
      - "mohammadi/Django/**"
      - ".github/workflows/ci-mohammadi.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mohammadi/Django

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rahban_db
          POSTGRES_USER: rahban_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rahban_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      DEBUG: "False"
      DB_NAME: rahban_db
      DB_USER: rahban_user
      DB_PASSWORD: ci_password
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mohammadi/Django/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test
